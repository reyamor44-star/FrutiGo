<svg viewBox="0 0 1000 1000" width="1000" height="1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Yellow Prism Roof Gradients -->
    <linearGradient id="roofTopLeft" x1="500" y1="24" x2="134" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFCA00" />
      <stop offset="60%" stop-color="#F0A500" />
      <stop offset="100%" stop-color="#D68E00" />
    </linearGradient>
    <linearGradient id="roofTopRight" x1="500" y1="24" x2="866" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF65C" />
      <stop offset="40%" stop-color="#FFDE1A" />
      <stop offset="80%" stop-color="#FFC600" />
      <stop offset="100%" stop-color="#F5B300" />
    </linearGradient>
    <linearGradient id="roofSlopeFront" x1="500" y1="146" x2="500" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD800" />
      <stop offset="100%" stop-color="#E09500" />
    </linearGradient>

    <!-- Inside Yellow Hood / Wing -->
    <linearGradient id="hoodYellowTop" x1="220" y1="320" x2="520" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF04D" />
      <stop offset="40%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>
    <linearGradient id="hoodYellowShadow" x1="220" y1="440" x2="440" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C78000" />
      <stop offset="100%" stop-color="#8E5800" />
    </linearGradient>

    <!-- Left Outer Wall Dark Charcoal -->
    <linearGradient id="leftWallGrad" x1="134" y1="252" x2="320" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2B303A" />
      <stop offset="50%" stop-color="#1C2027" />
      <stop offset="100%" stop-color="#12151B" />
    </linearGradient>

    <!-- Metallic Steel & Chrome Gradients for Right 3D 'G' -->
    <linearGradient id="metalTopSlant" x1="500" y1="320" x2="866" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="30%" stop-color="#D8DFEA" />
      <stop offset="70%" stop-color="#B4BFD0" />
      <stop offset="100%" stop-color="#8E9AAB" />
    </linearGradient>
    <linearGradient id="metalRightOuter" x1="866" y1="252" x2="680" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6DCE6" />
      <stop offset="35%" stop-color="#AAB4C4" />
      <stop offset="70%" stop-color="#788394" />
      <stop offset="100%" stop-color="#505967" />
    </linearGradient>
    <linearGradient id="metalBarTop" x1="866" y1="490" x2="540" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8EDF5" />
      <stop offset="40%" stop-color="#CBD4E1" />
      <stop offset="100%" stop-color="#98A4B6" />
    </linearGradient>
    <linearGradient id="metalBarBottom" x1="540" y1="560" x2="866" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#383E4B" />
      <stop offset="100%" stop-color="#1E222A" />
    </linearGradient>
    <linearGradient id="metalLowerSlope" x1="500" y1="740" x2="866" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8F99AB" />
      <stop offset="50%" stop-color="#636D7F" />
      <stop offset="100%" stop-color="#3E4653" />
    </linearGradient>

    <!-- Bottom Base Facets -->
    <linearGradient id="bottomBaseRight" x1="500" y1="976" x2="866" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A414E" />
      <stop offset="50%" stop-color="#5D6777" />
      <stop offset="100%" stop-color="#818D9F" />
    </linearGradient>
    <linearGradient id="bottomBaseLeft" x1="134" y1="748" x2="500" y2="976" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="50%" stop-color="#242A34" />
      <stop offset="100%" stop-color="#373F4D" />
    </linearGradient>

    <!-- Steering Wheel Gradients -->
    <linearGradient id="wheelRimMetal" x1="385" y1="470" x2="615" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D1D7E2" />
      <stop offset="35%" stop-color="#9DA6B5" />
      <stop offset="75%" stop-color="#6A7383" />
      <stop offset="100%" stop-color="#474E5C" />
    </linearGradient>
    <linearGradient id="wheelHubMetal" x1="470" y1="555" x2="530" y2="615" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6BFCF" />
      <stop offset="50%" stop-color="#7D8798" />
      <stop offset="100%" stop-color="#4A5260" />
    </linearGradient>

    <filter id="cubeShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#cubeShadow)">
    <!-- 1. Deep Black Interior Cavity -->
    <polygon points="134,252 500,320 866,252 866,748 500,976 134,748" fill="#07090C" />

    <!-- 2. Yellow Prism Roof (Top Isometric Facets) -->
    <!-- Left Slope (Golden shadow) -->
    <polygon points="500,24 134,252 500,146" fill="url(#roofTopLeft)" />
    <!-- Right Slope (Sunlit Canary) -->
    <polygon points="500,24 866,252 500,146" fill="url(#roofTopRight)" />
    <!-- Front Under-Bevel of Roof -->
    <polygon points="500,146 134,252 320,296 500,320 680,296 866,252" fill="url(#roofSlopeFront)" />
    <!-- Top Central Spine Crest Highlight -->
    <line x1="500" y1="24" x2="500" y2="146" stroke="#FFFDE6" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <line x1="500" y1="24" x2="866" y2="252" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- 3. Left Hexagon Outer Wall & Yellow Vehicle Hood/Wing Feature -->
    <polygon points="134,252 320,340 320,700 134,748" fill="url(#leftWallGrad)" />
    <!-- Yellow Hood / Vehicle Wing inside left cavity -->
    <polygon points="320,340 540,268 540,380 360,460 320,700" fill="url(#hoodYellowTop)" />
    <!-- Folded under-shadow of yellow hood -->
    <polygon points="320,340 360,460 320,700" fill="url(#hoodYellowShadow)" />
    <!-- Crisp highlight on vehicle hood edge -->
    <line x1="320" y1="340" x2="540" y2="268" stroke="#FFF699" stroke-width="4.5" stroke-linecap="round" opacity="0.7" />

    <!-- 4. Steering Wheel (Volante en el Centro de la Cavidad) -->
    <g transform="translate(500, 586)">
      <!-- Shadow behind the wheel -->
      <circle cx="0" cy="0" r="125" fill="none" stroke="#000000" stroke-width="32" opacity="0.6" />
      <!-- Outer metallic steering rim -->
      <circle cx="0" cy="0" r="125" fill="none" stroke="url(#wheelRimMetal)" stroke-width="28" />
      <!-- Top Chrome Reflection Arc -->
      <path d="M -108,-62 A 125 125 0 0 1 108,-62" fill="none" stroke="#FFFFFF" stroke-width="4.5" opacity="0.55" />
      
      <!-- Central Hub -->
      <circle cx="0" cy="0" r="48" fill="url(#wheelHubMetal)" stroke="#353C47" stroke-width="3.5" />
      <circle cx="0" cy="0" r="26" fill="#14171E" />
      <circle cx="0" cy="0" r="10" fill="#838B9B" opacity="0.9" />
      
      <!-- 3 Spokes (Left, Right, Bottom) -->
      <path d="M -44,-12 L -111,-12 L -111,14 L -44,14 Z" fill="url(#wheelRimMetal)" />
      <path d="M 44,-12 L 111,-12 L 111,14 L 44,14 Z" fill="url(#wheelRimMetal)" />
      <path d="M -14,42 L -14,111 L 14,111 L 14,42 Z" fill="url(#wheelRimMetal)" />
      
      <!-- Spoke Chrome Top Highlights -->
      <line x1="-109" y1="-10" x2="-46" y2="-10" stroke="#FFFFFF" stroke-width="2" opacity="0.65" />
      <line x1="46" y1="-10" x2="109" y2="-10" stroke="#FFFFFF" stroke-width="2" opacity="0.65" />
      <line x1="-12" y1="44" x2="-12" y2="109" stroke="#FFFFFF" stroke-width="2" opacity="0.45" />
    </g>

    <!-- 5. 3D Metallic 'G' Structure on Right Side -->
    <!-- Top Inward Bevel under Yellow Roof -->
    <polygon points="500,320 866,252 750,332 510,420" fill="url(#metalTopSlant)" />
    
    <!-- Outer Right Wall of G -->
    <polygon points="866,252 866,748 745,675 745,332" fill="url(#metalRightOuter)" />
    <!-- Right outer vertical chiseled light bevel -->
    <line x1="866" y1="252" x2="866" y2="748" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.7" />
    
    <!-- G Horizontal Inward Bar (Towards Steering Wheel) -->
    <polygon points="590,465 866,465 866,548 590,548" fill="url(#metalBarTop)" />
    <polygon points="590,548 866,548 745,675 590,675" fill="url(#metalBarBottom)" />
    <!-- Front facet of G Central Bar -->
    <polygon points="590,465 625,445 625,568 590,548" fill="#F3F6FA" />

    <!-- G Lower Diagonal Ramp / Bottom Curve -->
    <polygon points="500,740 745,675 866,748 500,976" fill="url(#metalLowerSlope)" />
    <polygon points="500,740 745,675 640,626 500,666" fill="#2D333D" />

    <!-- 6. Bottom Hexagon Base Facets -->
    <polygon points="134,748 500,976 500,832 134,748" fill="url(#bottomBaseLeft)" />
    <polygon points="500,976 866,748 745,675 500,832" fill="url(#bottomBaseRight)" />
    
    <!-- Bottom Chiseled Seam Highlight Line -->
    <line x1="500" y1="832" x2="500" y2="976" stroke="#CCD3DF" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>