<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching dark emerald teal -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#043E2F" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Metallic Gold Accent for Fruti Go Arrow/Logo -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Emerald Background Layer -->
  <rect width="600" height="750" fill="url(#bgGradient)" rx="0" />

  <!-- Subtle Radial Ambient Light behind Executive Profile -->
  <circle cx="300" cy="280" r="220" fill="#10B981" opacity="0.12" />

  <!-- Executive Male Figure Illustration (Suit, Shirt, Face Structure) -->
  <g id="executive-figure">
    <!-- Dark Blazer Body & Shoulders -->
    <path d="M 80 750 L 140 520 C 180 440, 420 440, 460 520 L 520 750 Z" fill="#0F172A" />
    
    <!-- Inner Blazer Collar Left -->
    <path d="M 170 500 L 250 620 L 220 750 L 120 750 Z" fill="#1E293B" />
    
    <!-- Inner Blazer Collar Right -->
    <path d="M 430 500 L 350 620 L 380 750 L 480 750 Z" fill="#1E293B" />

    <!-- Open Crisp White Shirt V-Neck -->
    <path d="M 240 450 L 300 580 L 360 450 L 330 400 L 270 400 Z" fill="#FFFFFF" />
    <path d="M 270 400 L 300 540 L 330 400 Z" fill="#F1F5F9" />

    <!-- Neck Structure -->
    <path d="M 260 340 L 260 420 C 260 450, 340 450, 340 420 L 340 340 Z" fill="#E5D0C0" />
    <path d="M 260 380 C 280 410, 320 410, 340 380 L 340 420 C 340 450, 260 450, 260 420 Z" fill="#D4BBA8" opacity="0.6" />

    <!-- Head & Face Outline -->
    <path d="M 200 240 C 200 130, 400 130, 400 240 C 400 320, 380 370, 300 370 C 220 370, 200 320, 200 240 Z" fill="#F3E0D2" />
    
    <!-- Defined Jaw & Chin Shadow -->
    <path d="M 210 260 C 210 350, 390 350, 390 260 C 390 345, 360 365, 300 365 C 240 365, 210 345, 210 260 Z" fill="#E5D0C0" />

    <!-- Executive Short Brown Hairline -->
    <path d="M 195 210 C 200 120, 400 120, 405 210 C 380 160, 350 150, 300 150 C 250 150, 220 160, 195 210 Z" fill="#3D2612" />
    <path d="M 210 180 C 230 135, 370 135, 390 180 C 370 145, 330 140, 300 140 C 270 140, 230 145, 210 180 Z" fill="#2A1808" />

    <!-- Ears -->
    <circle cx="198" cy="250" r="18" fill="#F3E0D2" />
    <circle cx="402" cy="250" r="18" fill="#F3E0D2" />

    <!-- Confident Eyes & Eyebrows -->
    <path d="M 235 215 C 250 205, 270 210, 275 215" stroke="#2A1808" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 325 215 C 330 210, 350 205, 365 215" stroke="#2A1808" stroke-width="4" stroke-linecap="round" fill="none" />
    
    <ellipse cx="255" cy="232" rx="10" ry="6" fill="#FFFFFF" />
    <circle cx="255" cy="232" r="4" fill="#3D2612" />
    
    <ellipse cx="345" cy="232" rx="10" ry="6" fill="#FFFFFF" />
    <circle cx="345" cy="232" r="4" fill="#3D2612" />

    <!-- Nose -->
    <path d="M 300 230 L 295 275 L 305 275 Z" fill="#D4BBA8" />

    <!-- Warm Smiling Mouth -->
    <path d="M 255 305 C 275 325, 325 325, 345 305" stroke="#9A3412" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 260 307 C 280 320, 320 320, 340 307" fill="#FFFFFF" />
  </g>

  <!-- Editorial Text Overlay (Matching the User's Image Layout) -->
  <g id="text-overlays" filter="url(#dropShadow)">
    <!-- "DELIVERY REVOLUTION" Red Header Badge -->
    <text x="560" y="240" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#EF4444" letter-spacing="1">
      DELIVERY
    </text>
    <text x="560" y="272" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#EF4444" letter-spacing="1">
      REVOLUTION
    </text>

    <!-- "FRUTI GO'S ALBERTO REYES SANDOVAL" Subtitle -->
    <text x="560" y="315" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="0.5">
      FRUTI GO'S
    </text>
    <text x="560" y="342" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="22" fill="#34D399" letter-spacing="0.5">
      ALBERTO REYES
    </text>
    <text x="560" y="368" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16" fill="#F3F4F6" letter-spacing="1">
      FUNDADOR &amp; CEO
    </text>
  </g>

  <!-- Main "Fruti Go" Branding Logo at Bottom Right -->
  <g id="brand-logo" transform="translate(320, 520)" filter="url(#dropShadow)">
    <!-- Giant Bold White "Fruti" -->
    <text x="230" y="80" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-style="italic" font-size="80" fill="#FFFFFF" letter-spacing="-2">
      Fruti
    </text>
    <!-- Giant Bold White "Go" -->
    <text x="230" y="150" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-style="italic" font-size="80" fill="#FFFFFF" letter-spacing="-2">
      Go
    </text>

    <!-- Golden Swoosh Arrow underneath -->
    <path d="M 30 165 Q 130 205 240 135 L 210 130 Q 130 180 50 155 Z" fill="url(#goldGradient)" filter="url(#glow)" />
  </g>

  <!-- Top Left Verification Chip -->
  <g id="verification-chip" transform="translate(30, 30)">
    <rect width="210" height="42" rx="21" fill="#065F46" stroke="#34D399" stroke-width="1.5" />
    <circle cx="21" cy="21" r="12" fill="#10B981" />
    <path d="M 16 21 L 19 24 L 26 17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="42" y="26" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" letter-spacing="1">
      DESARROLLADOR
    </text>
  </g>
</svg>
